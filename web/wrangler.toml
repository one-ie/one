# ONE Demo — Integrated claw + landing page
name = "one-demo"
# main is set by @astrojs/cloudflare in the generated dist/server/wrangler.json.
# Setting it here breaks `astro build` because @cloudflare/vite-plugin asserts
# the file exists at config-resolution time, before astro has emitted it.
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
html_handling = "drop-trailing-slash"

[[kv_namespaces]]
binding = "SESSION"
id = "fdc28eb10d2443d7bb6402f92340bb8d"

[[kv_namespaces]]
binding = "CHAT_CACHE"
id = "203df225c45e4c24a62896c9464368a2"

[[kv_namespaces]]
binding = "THREADS"
id = "f52a2e9c40e542a2bfd99f0198b986e2"

[ai]
binding = "AI"

[placement]
mode = "smart"

[vars]
AGENT_ID = "one-demo"
AGENT_NAME = "ONE Demo"
AGENT_MODEL = "meta-llama/llama-4-maverick"
ONE_API_URL = "https://dev.one.ie"
# RP_ID and ORIGIN resolve from url.hostname / url.origin at runtime.
# Override as Cloudflare secrets if needed: wrangler secret put RP_ID

# Custom domain
[[routes]]
pattern = "demo.one.ie"
custom_domain = true

# Secrets: wrangler secret put OPENROUTER_API_KEY
# Secrets: wrangler secret put SERVER_SECRET

[[r2_buckets]]
binding = "CONTENT"
bucket_name = "one-content"

[[d1_databases]]
binding = "DB"
database_name = "one-owners"
database_id = "0559422e-37de-4c27-9667-a43895578e6f"
