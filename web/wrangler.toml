# ONE Demo — Integrated claw + landing page
name = "one-demo"
# main is set by @astrojs/cloudflare in the generated dist/server/wrangler.json.
# Setting it here breaks `astro build` because @cloudflare/vite-plugin asserts
# the file exists at config-resolution time, before astro has emitted it.
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

[[kv_namespaces]]
binding = "SESSION"
id = "fdc28eb10d2443d7bb6402f92340bb8d"

[ai]
binding = "AI"

[vars]
AGENT_ID = "one-demo"
AGENT_NAME = "ONE Demo"
AGENT_MODEL = "meta-llama/llama-4-maverick"
ONE_API_URL = "https://dev.one.ie"

# Custom domain
[[routes]]
pattern = "demo.one.ie"
custom_domain = true

# Secrets: wrangler secret put OPENROUTER_API_KEY
