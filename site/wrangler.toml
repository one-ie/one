name = "web"
# main intentionally omitted — Astro Cloudflare adapter sets the entry at build/deploy time
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
binding = "ASSETS"

[[kv_namespaces]]
binding = "KV"
id = "change-me"

[[d1_databases]]
binding = "DB"
database_name = "web"
database_id = "change-me"
