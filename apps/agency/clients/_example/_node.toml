# A client is a business relationship, not just a name. Copy this file to
# clients/<slug>.toml, fill it in, then:
#   one client add <slug>      → you own the workspace (managed)
#   one client invite <slug>   → the client owns it (self-serve)

name        = "Acme Corp"
slug        = "acme"
owner       = "cto@acme.com"   # managed → seeded as the owner actor; invite → who the invite is for
plan        = "studio"
markup_pct  = 20               # per-client override (your agency markup is the active cascade)
monthly_cap = 50000            # spend ceiling in credits
brand_lock  = true             # white-label to your brand
credits     = 50000            # initial credit grant
agents      = ["sales", "support"]   # starter agents cloned into the client workspace
