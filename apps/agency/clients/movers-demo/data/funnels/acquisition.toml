id          = "acquisition"
label       = "Acquisition Funnel"
description = "Full conversion funnel for Summit Movers: search/ad/referral → lead → booked move → compounding review. Ties marketing → sales → service → education into one measurable view."

# Stage order mirrors the lifecycle hand-off chain.
# conversion_target = the % expected to advance to the next stage.

[[stages]]
id                  = "landed"
lifecycle           = "marketing"
lifecycle_stage     = "awareness"
label               = "Landed"
description         = "Visitor on a city / service-area page. Source tracked: gmb | google_organic | google_ads | referral | nextdoor | yelp | inbound_call."
conversion_target   = "20"

[[stages]]
id                  = "lead_in"
lifecycle           = "marketing"
lifecycle_stage     = "interest"
label               = "Lead in"
description         = "Took an action — clicked estimate CTA, called, or started the short form. lead-capture fires. Response target: < 5 min."
conversion_target   = "60"

[[stages]]
id                  = "quote_requested"
lifecycle           = "sales"
lifecycle_stage     = "quote_requested"
label               = "Quote requested"
description         = "In-home or video estimate proposed. quote-to-booking fires."
conversion_target   = "70"

[[stages]]
id                  = "estimate_booked"
lifecycle           = "sales"
lifecycle_stage     = "estimate_booked"
label               = "Estimate booked"
description         = "Survey scheduled. Movers who get to the estimate close at ~70% — this is the conversion keystone."
conversion_target   = "70"

[[stages]]
id                  = "booked"
lifecycle           = "sales"
lifecycle_stage     = "booked"
label               = "Booked"
description         = "Move confirmed and dated. move-day-service fires."
conversion_target   = "90"

[[stages]]
id                  = "completed"
lifecycle           = "service"
lifecycle_stage     = "completed"
label               = "Completed"
description         = "Move done. CSAT collected."
conversion_target   = "80"

[[stages]]
id                  = "compounding"
lifecycle           = "education"
lifecycle_stage     = "reviewed"
label               = "Review + referral"
description         = "Happy close → Google review → named referral. Each review compounds every future city page. Target: 40% of happy closes leave a review; 15% name a referral."
conversion_target   = "40"

# Benchmarks applied at analytics reporting time.
[benchmarks]
response_time_minutes   = 5
estimate_book_within_h  = 24
quote_send_same_day     = true
csat_floor              = 4.0
review_rate_pct         = 40
referral_rate_pct       = 15
lost_reentry_days       = 30

# Leak points where movers most often lose the deal.
# analytics agent watches these and flags when rates fall below floor.
[[leak_points]]
stage   = "lead_in"
signal  = "no estimate booked within 24h"
action  = "re-nurture workflow fires at day 1, day 3, day 5"

[[leak_points]]
stage   = "quote_requested"
signal  = "quote sent, no reply within 48h"
action  = "sales agent sends one objection-handler follow-up"

[[leak_points]]
stage   = "lost"
signal  = "lifecycle:sales:lost tagged"
action  = "re-nurture fires at day 30 (seasonal window check)"
