id          = "move-lead"
label       = "Move lead"
description = "An inbound lead from someone who needs to move — the unit the lead-gen funnel captures and converts."

[[fields]]
name  = "name"
type  = "string"
label = "Name"

[[fields]]
name  = "phone"
type  = "string"
label = "Phone"

[[fields]]
name  = "email"
type  = "string"
label = "Email"

[[fields]]
name  = "move_date"
type  = "string"
label = "Move date"
description = "Target date or window; urgency driver."

[[fields]]
name  = "from_zip"
type  = "string"
label = "Origin zip"

[[fields]]
name  = "to_zip"
type  = "string"
label = "Destination zip"

[[fields]]
name  = "home_size"
type  = "string"
label = "Home size"
description = "studio | 1-BR | 2-BR | 3-BR | 4-BR+ | office"

[[fields]]
name  = "move_type"
type  = "string"
label = "Move type"
description = "local | long-distance | intrastate-long-distance"

[[fields]]
name  = "add_ons"
type  = "string"
label = "Add-ons"
description = "packing | unpacking | storage | specialty | junk-removal"

[[fields]]
name  = "source"
type  = "string"
label = "Lead source"
description = "gmb | google_organic | google_ads | referral | b2b_partner | nextdoor | yelp | inbound_call"

[[fields]]
name  = "utm_campaign"
type  = "string"
label = "UTM campaign"
description = "Campaign slug if lead arrived via a tracked campaign URL (e.g. summer-2026, b2b-apt-austin)."

[[fields]]
name  = "partner_id"
type  = "string"
label = "B2B partner ID"
description = "Contact ID of the referring B2B partner (apartment complex or RE agent). Set when source=b2b_partner."

[[fields]]
name  = "city_page"
type  = "string"
label = "City page"
description = "Which service×city page captured the lead — feeds per-page conversion attribution."
