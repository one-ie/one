id          = "kpis"
label       = "KPIs — {{Company}}"
description = "The 9 numbers that tell this operator whether the funnel works. The analytics agent reads these targets/floors and warn()s when actual falls below floor. Owner-facing only."

# Cadence: weekly Monday brief (ai/agents/analytics.md).
# Fill operator name in label before one push.

[[metrics]]
id          = "response_time"
label       = "Lead response time"
unit        = "minutes"
target      = 5
floor       = 15
description = "marketing:interest → first reply. The biggest mover drop-off lever."
signal_warn = "response_time > floor"

[[metrics]]
id          = "lead_to_estimate"
label       = "Lead → estimate booked rate"
unit        = "percent"
target      = 60
floor       = 40
description = "% of leads who book an in-home/video estimate. The funnel keystone."
signal_warn = "lead_to_estimate < floor"

[[metrics]]
id          = "estimate_to_book"
label       = "Estimate → booked move rate"
unit        = "percent"
target      = 70
floor       = 55
description = "Once the estimate runs, ~70% close. Below 55% = pricing or trust gap."
signal_warn = "estimate_to_book < floor"

[[metrics]]
id          = "close_rate"
label       = "End-to-end close rate"
unit        = "percent"
target      = 30
floor       = 20
description = "Lead → booked move. Composite of the two gates above. Below 20% = top-of-funnel quality or speed issue."
signal_warn = "close_rate < floor"

[[metrics]]
id          = "csat"
label       = "CSAT score"
unit        = "score_1_5"
target      = 4.5
floor       = 4.0
description = "Post-move customer satisfaction (1–5). Below 4.0 = operational issue; review-referral workflow halts. Track by crew and by city."
signal_warn = "csat < floor"

[[metrics]]
id          = "review_rate"
label       = "Happy close → Google review rate"
unit        = "percent"
target      = 40
floor       = 25
description = "% of CSAT ≥ 4 customers who leave a Google review. The compounding asset. Below 25% = messaging or timing issue in review-referral workflow."
signal_warn = "review_rate < floor"

[[metrics]]
id          = "referral_rate"
label       = "Customer → named referral rate"
unit        = "percent"
target      = 15
floor       = 8
description = "% of reviewed customers who name a referral. At 15% this is the cheapest lead source; below 8% tighten the referral ask timing."
signal_warn = "referral_rate < floor"

[[metrics]]
id          = "cac"
label       = "Customer acquisition cost"
unit        = "usd"
target      = 80
floor       = 200
description = "Blended cost per booked move across all channels. Referral/organic CAC ~$20; paid ads ~$150–300. Floor = $200 blended."
signal_warn = "cac > floor"

[[metrics]]
id          = "pipeline_velocity"
label       = "Pipeline velocity (leads/week)"
unit        = "count"
target      = 20
floor       = 10
description = "New leads entering lifecycle:marketing:interest per week. Seasonally adjusted: summer peak (May–Aug) target doubles to 40. Below floor during peak = campaign or SEO gap."
signal_warn = "pipeline_velocity < floor"

# Attribution buckets — analytics agent groups leads by source weekly.
[[attribution]]
source      = "gmb"
label       = "Google Business Profile"
note        = "Highest-intent, zero marginal cost. Every city page should drive GMB impression share."

[[attribution]]
source      = "google_organic"
label       = "Organic search"
note        = "City × service page. Compounds over time. Track per city page CVR."

[[attribution]]
source      = "google_ads"
label       = "Google Ads"
note        = "Highest CAC. Pause if CAC > $200 for 3 consecutive weeks."

[[attribution]]
source      = "referral"
label       = "Customer referral"
note        = "Lowest CAC (~$20), highest close rate. Feed the review-referral loop."

[[attribution]]
source      = "b2b_partner"
label       = "B2B partner (apt complex / RE agent)"
note        = "Reciprocal partnership channel. Volume lower, close rate high (warm intro). Track separately."

[[attribution]]
source      = "nextdoor"
label       = "Nextdoor / local social"
note        = "High-trust, hyperlocal. Good for apartment-heavy neighbourhoods."
