id          = "service"
label       = "Service"
description = "Booked → completed → closed. Pre-move confirmation, apartment/commercial COI, move-day comms, damage claims, and CSAT. A clean move is what earns the review."

[[stages]]
id    = "scheduled"
label = "Scheduled"
tags  = ["lifecycle:service:scheduled"]
description = "Move on the calendar. Confirmation sent within the hour; arrival window (never a guaranteed time) stated."

[[stages]]
id    = "confirmed"
label = "Confirmed"
tags  = ["lifecycle:service:confirmed"]
description = "Re-confirmed 24–48h out. COI filed if origin/destination is a managed building."

[[stages]]
id    = "move_day"
label = "Move day"
tags  = ["lifecycle:service:move_day"]
description = "Crew dispatched. Service agent reachable. A blocked/delayed move is p1 — same-day or escalate."

[[stages]]
id    = "completed"
label = "Completed"
tags  = ["lifecycle:service:completed"]
description = "Move done. mark('move:completed'). CSAT request sent."

[[stages]]
id    = "closed"
label = "Closed"
tags  = ["lifecycle:service:closed"]
description = "CSAT ≥ 4 → fires review-referral. CSAT < 4 → retention:risk + human:ask(owner); no review ask."
