[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oneie"
version = "0.1.0"
description = "ONE agent runtime — load agent.md, register on Almanac, run via OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "uagents>=0.13.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  "click>=8.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
oneie = "oneie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oneie"]
