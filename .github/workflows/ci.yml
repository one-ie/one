name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: cd site && bun install
      - name: Build
        run: cd site && bun run build
      - name: Typecheck
        run: cd site && bun run typecheck
      - name: Standalone mode build (no API key)
        run: cd site && ONE_API_KEY="" bun run build
