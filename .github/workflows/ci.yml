name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: cd apps/web && bun install
      - name: Build
        run: cd apps/web && bun run build
      - name: Typecheck
        run: cd apps/web && bun run typecheck
      - name: STRIP guard
        run: bash scripts/strip-guard.sh
      - name: Install workspace deps
        run: bun install
      - name: Tests
        run: bun vitest run tests/
      - name: Standalone mode build (no API key)
        run: cd apps/web && ONE_API_KEY="" bun run build
